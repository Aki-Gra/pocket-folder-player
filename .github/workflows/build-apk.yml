      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile Android APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare downloadable APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PocketFolderPlayer.apk

      - name: Upload APK without ZIP wrapper
        uses: actions/upload-artifact@v7
        with:
          path: PocketFolderPlayer.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
          
